

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador de Historias de Usuario</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      padding: 42px;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 400px;
    }
    textarea {
      width: 100%;
      height: 100px;
      margin-bottom: 10px;
    }
    button {
      background: #003366;
      color: white;
      padding: 10px;
      border: none;
      cursor: pointer;
    }
    .output {
      margin-top: 15px;
      white-space: pre-line;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Generador de Historias</h2>
  <textarea id="input" placeholder="Describe la feature..."></textarea>
  <button onclick="generar()">Generar</button>
  <div class="output" id="output"></div>
</div>

<script>
function generar() {
  const input = document.getElementById("input").value;

  if (!input) {
    document.getElementById("output").textContent = "Escribe una especificación";
    return;
  }

  const resultado = `
Historia de usuario:
Como usuario, quiero ${input} para mejorar mi experiencia.

Descripción:
Esta funcionalidad permite ${input} de forma clara y eficiente.

Criterios de aceptación:
- El sistema permite ${input}
- Se valida correctamente la información
- El usuario recibe feedback claro
`;

  document.getElementById("output").textContent = resultado;
}
</script>

</body>
</html>
